name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install numpy matplotlib pytest
      - name: Run tests
        run: python -m pytest -q test_plot_stress_strain.py
      - name: Plot the committed curves
        run: python plot_stress_strain.py -o stress_strain.png
